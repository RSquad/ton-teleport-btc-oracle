name: Publish to rsquad-sandbox DOCR

on:
  push:
    branches:
      - sandbox

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v1
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.SANDBOX_DOCR_USERNAME }}
          password: ${{ secrets.SANDBOX_DOCR_PASSWORD }}

      - name: Set environment variables
        run: |
          echo "${{ vars.SANDBOX_PARAMS }}" | tr ' ' '\n' >> .env
          echo TON_CENTER_API_KEY=${{ secrets.SANDBOX_TON_CENTER_API_KEY }} >> .env

      - name: Build and push Docker image
        run: |
          docker build -t registry.digitalocean.com/rsquad-sandbox/ton-teleport-btc-oracle:latest .
          docker push registry.digitalocean.com/rsquad-sandbox/ton-teleport-btc-oracle:latest